<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips | TransitConnect</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        /* ================================
           NAVBAR
        ================================= */

        .navbar {
            background: #0f172a;
            color: white;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* ================================
           PAGE HEADER
        ================================= */

        .page-header {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 45px 7%;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #dbeafe;
        }

        /* ================================
           CONTAINER
        ================================= */

        .container {
            width: 86%;
            max-width: 1150px;
            margin: 35px auto 60px;
        }

        /* ================================
           SUMMARY CARDS
        ================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 7px 22px rgba(15, 23, 42, 0.07);
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .stat-card span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stat-card strong {
            font-size: 25px;
            color: #0f172a;
        }

        /* ================================
           SECTION
        ================================= */

        .section {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .section-header h2 {
            color: #0f172a;
        }

        .section-header p {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        .sort-select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        /* ================================
           TRIP CARD
        ================================= */

        .trip-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .trip-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            transition: 0.2s;
        }

        .trip-card:hover {
            box-shadow: 0 7px 20px rgba(15, 23, 42, 0.08);
            border-color: #bfdbfe;
        }

        .trip-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .operator {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .transport-icon {
            width: 50px;
            height: 50px;
            background: #eff6ff;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .operator h3 {
            color: #0f172a;
            margin-bottom: 5px;
        }

        .operator p {
            color: #64748b;
            font-size: 13px;
        }

        .status {
            background: #dcfce7;
            color: #166534;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .trip-route {
            padding: 22px 20px;
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            align-items: center;
            gap: 15px;
        }

        .place h4 {
            font-size: 17px;
            color: #0f172a;
            margin-bottom: 5px;
        }

        .place p {
            color: #64748b;
            font-size: 13px;
        }

        .place.right {
            text-align: right;
        }

        .route-arrow {
            width: 45px;
            height: 45px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 20px;
        }

        .trip-details {
            background: #f8fafc;
            padding: 17px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .detail span {
            display: block;
            color: #64748b;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .detail strong {
            color: #334155;
            font-size: 13px;
        }

        .trip-bottom {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .ticket-id {
            color: #64748b;
            font-size: 12px;
        }

        .ticket-id strong {
            color: #334155;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .view-button {
            background: #2563eb;
            color: white;
        }

        .view-button:hover {
            background: #1d4ed8;
        }

        .delete-button {
            background: #fee2e2;
            color: #b91c1c;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        /* ================================
           EMPTY STATE
        ================================= */

        .empty {
            text-align: center;
            padding: 55px 20px;
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty h2 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .empty p {
            color: #64748b;
            max-width: 500px;
            margin: 0 auto 25px;
            line-height: 1.6;
        }

        .plan-button {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 9px;
            font-weight: bold;
            font-size: 14px;
        }

        .plan-button:hover {
            background: #1d4ed8;
        }

        /* ================================
           FOOTER
        ================================= */

        footer {
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 25px;
            font-size: 13px;
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .trip-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .trip-top {
                align-items: flex-start;
            }

        }

        @media (max-width: 600px) {

            .nav-links {
                display: none;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .container {
                width: 92%;
            }

            .section {
                padding: 20px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .trip-route {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .place.right {
                text-align: center;
            }

            .route-arrow {
                transform: rotate(90deg);
            }

            .trip-details {
                grid-template-columns: 1fr 1fr;
            }

            .trip-bottom {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions {
                width: 100%;
            }

            .actions .button {
                flex: 1;
                text-align: center;
            }

        }
    </style>
</head>

<body>

    <!-- ================================
         NAVIGATION
    ================================= -->

    <nav class="navbar">

        <div class="logo">
            Transit<span>Connect</span>
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="journey-planner.html">Plan Journey</a>
            <a href="my-trips.html">My Trips</a>
            <a href="safety.html">Safety</a>
        </div>

    </nav>


    <!-- ================================
         HEADER
    ================================= -->

    <section class="page-header">

        <h1>My Trips</h1>

        <p>
            View your booked journeys and digital tickets.
        </p>

    </section>


    <main class="container">


        <!-- ================================
             STATISTICS
        ================================= -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    🎫
                </div>

                <span>Total Trips</span>

                <strong id="totalTrips">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    💳
                </div>

                <span>Paid Trips</span>

                <strong id="paidTrips">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    💰
                </div>

                <span>Total Spent</span>

                <strong id="totalSpent">
                    R0.00
                </strong>

            </div>

        </div>


        <!-- ================================
             TRIPS SECTION
        ================================= -->

        <section class="section">

            <div class="section-header">

                <div>

                    <h2>Booking History</h2>

                    <p>
                        Your TransitConnect journey bookings.
                    </p>

                </div>


                <select
                    id="sortTrips"
                    class="sort-select">

                    <option value="newest">
                        Newest First
                    </option>

                    <option value="oldest">
                        Oldest First
                    </option>

                    <option value="price-high">
                        Highest Fare
                    </option>

                    <option value="price-low">
                        Lowest Fare
                    </option>

                </select>

            </div>


            <div
                id="tripList"
                class="trip-list">

                <!-- Trips loaded here -->

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 TransitConnect.
            Frontend prototype for demonstration purposes.
        </p>

    </footer>


    <script>

        // ==========================================
        // AUTHENTICATION CHECK
        // ==========================================

        const currentUser =
            JSON.parse(
                localStorage.getItem("currentUser")
            );

        if (!currentUser) {

            window.location.href =
                "login.html";

        }


        // ==========================================
        // ELEMENTS
        // ==========================================

        const tripList =
            document.getElementById("tripList");

        const totalTrips =
            document.getElementById("totalTrips");

        const paidTrips =
            document.getElementById("paidTrips");

        const totalSpent =
            document.getElementById("totalSpent");

        const sortTrips =
            document.getElementById("sortTrips");


        // ==========================================
        // GET BOOKINGS
        // ==========================================

        function getUserBookings() {

            const bookings =
                JSON.parse(
                    localStorage.getItem("bookings") || "[]"
                );

            return bookings.filter(
                booking =>
                    booking.userId === currentUser.id
            );

        }


        // ==========================================
        // FORMAT DATE
        // ==========================================

        function formatDate(date) {

            if (!date) {
                return "Not specified";
            }

            return new Date(
                date + "T00:00:00"
            ).toLocaleDateString(
                "en-ZA",
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        // ==========================================
        // FORMAT PAYMENT DATE
        // ==========================================

        function formatPaymentDate(date) {

            if (!date) {
                return "N/A";
            }

            return new Date(date)
                .toLocaleDateString(
                    "en-ZA",
                    {
                        day: "numeric",
                        month: "short",
                        year: "numeric"
                    }
                );

        }


        // ==========================================
        // FORMAT DURATION
        // ==========================================

        function formatDuration(minutes) {

            if (!minutes) {
                return "N/A";
            }

            const hours =
                Math.floor(minutes / 60);

            const mins =
                minutes % 60;

            if (hours === 0) {
                return `${mins} min`;
            }

            if (mins === 0) {
                return `${hours} hr`;
            }

            return `${hours} hr ${mins} min`;

        }


        // ==========================================
        // SORT BOOKINGS
        // ==========================================

        function sortBookings(bookings) {

            const sort =
                sortTrips.value;

            const copy =
                [...bookings];


            if (sort === "newest") {

                copy.sort(
                    (a, b) =>
                        new Date(b.paidAt) -
                        new Date(a.paidAt)
                );

            }


            if (sort === "oldest") {

                copy.sort(
                    (a, b) =>
                        new Date(a.paidAt) -
                        new Date(b.paidAt)
                );

            }


            if (sort === "price-high") {

                copy.sort(
                    (a, b) =>
                        Number(b.route.price) -
                        Number(a.route.price)
                );

            }


            if (sort === "price-low") {

                copy.sort(
                    (a, b) =>
                        Number(a.route.price) -
                        Number(b.route.price)
                );

            }


            return copy;

        }


        // ==========================================
        // UPDATE STATISTICS
        // ==========================================

        function updateStatistics(bookings) {

            totalTrips.textContent =
                bookings.length;


            const paid =
                bookings.filter(
                    booking =>
                        booking.status === "Paid"
                );

            paidTrips.textContent =
                paid.length;


            const spent =
                bookings.reduce(
                    (total, booking) => {

                        return total +
                            Number(
                                booking.route?.price || 0
                            );

                    },
                    0
                );


            totalSpent.textContent =
                `R${spent.toFixed(2)}`;

        }


        // ==========================================
        // DISPLAY EMPTY STATE
        // ==========================================

        function showEmptyState() {

            tripList.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🎫
                    </div>

                    <h2>
                        No Trips Yet
                    </h2>

                    <p>
                        You have not booked a journey yet.
                        Use the journey planner to compare
                        taxi, bus, train and integrated routes.
                    </p>

                    <a
                        href="journey-planner.html"
                        class="plan-button">
                        Plan a Journey
                    </a>

                </div>

            `;

        }


        // ==========================================
        // RENDER TRIPS
        // ==========================================

        function renderTrips() {

            let bookings =
                getUserBookings();


            updateStatistics(bookings);


            if (bookings.length === 0) {

                showEmptyState();

                return;

            }


            bookings =
                sortBookings(bookings);


            tripList.innerHTML = "";


            bookings.forEach(booking => {

                const route =
                    booking.route;


                const card =
                    document.createElement("div");

                card.className =
                    "trip-card";


                card.innerHTML = `

                    <!-- TOP -->

                    <div class="trip-top">

                        <div class="operator">

                            <div class="transport-icon">
                                ${route.icon || "🚌"}
                            </div>

                            <div>

                                <h3>
                                    ${route.operator}
                                </h3>

                                <p>
                                    ${route.type} Journey
                                </p>

                            </div>

                        </div>


                        <div class="status">
                            ${booking.status || "Paid"}
                        </div>

                    </div>


                    <!-- ROUTE -->

                    <div class="trip-route">

                        <div class="place">

                            <h4>
                                ${route.from}
                            </h4>

                            <p>
                                Departure:
                                ${route.departure}
                            </p>

                        </div>


                        <div class="route-arrow">
                            →
                        </div>


                        <div class="place right">

                            <h4>
                                ${route.to}
                            </h4>

                            <p>
                                Arrival:
                                ${route.arrival}
                            </p>

                        </div>

                    </div>


                    <!-- DETAILS -->

                    <div class="trip-details">

                        <div class="detail">

                            <span>
                                Travel Date
                            </span>

                            <strong>
                                ${formatDate(
                                    booking.travelDate
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Duration
                            </span>

                            <strong>
                                ${formatDuration(
                                    route.duration
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Payment
                            </span>

                            <strong>
                                ${booking.method}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Fare
                            </span>

                            <strong>
                                R${Number(
                                    route.price
                                ).toFixed(2)}
                            </strong>

                        </div>

                    </div>


                    <!-- BOTTOM -->

                    <div class="trip-bottom">

                        <div class="ticket-id">

                            Ticket:
                            <strong>
                                ${booking.ticketId}
                            </strong>

                        </div>


                        <div class="actions">

                            <button
                                class="button view-button"
                                data-ticket-id="${booking.ticketId}">
                                View Ticket
                            </button>

                            <button
                                class="button delete-button"
                                data-booking-id="${booking.id}">
                                Remove
                            </button>

                        </div>

                    </div>

                `;


                tripList.appendChild(card);

            });


            // ==========================================
            // VIEW TICKET EVENTS
            // ==========================================

            const viewButtons =
                document.querySelectorAll(
                    "[data-ticket-id]"
                );


            viewButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    function() {

                        const ticketId =
                            this.dataset.ticketId;


                        const bookings =
                            JSON.parse(
                                localStorage.getItem(
                                    "bookings"
                                ) || "[]"
                            );


                        const ticket =
                            bookings.find(
                                booking =>
                                    booking.ticketId ===
                                    ticketId &&
                                    booking.userId ===
                                    currentUser.id
                            );


                        if (!ticket) {

                            alert(
                                "Ticket could not be found."
                            );

                            return;

                        }


                        localStorage.setItem(
                            "latestTicket",
                            JSON.stringify(ticket)
                        );


                        window.location.href =
                            "ticket.html";

                    }
                );

            });


            // ==========================================
            // REMOVE BOOKING EVENTS
            // ==========================================

            const deleteButtons =
                document.querySelectorAll(
                    "[data-booking-id]"
                );


            deleteButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    function() {

                        const bookingId =
                            this.dataset.bookingId;


                        const confirmed =
                            confirm(
                                "Remove this booking from your trip history?"
                            );


                        if (!confirmed) {
                            return;
                        }


                        let bookings =
                            JSON.parse(
                                localStorage.getItem(
                                    "bookings"
                                ) || "[]"
                            );


                        bookings =
                            bookings.filter(
                                booking =>
                                    !(
                                        booking.id ===
                                        bookingId &&
                                        booking.userId ===
                                        currentUser.id
                                    )
                            );


                        localStorage.setItem(
                            "bookings",
                            JSON.stringify(bookings)
                        );


                        renderTrips();

                    }
                );

            });

        }


        // ==========================================
        // SORT EVENT
        // ==========================================

        sortTrips.addEventListener(
            "change",
            renderTrips
        );


        // ==========================================
        // INITIAL LOAD
        // ==========================================

        renderTrips();

    </script>

</body>
</html>
