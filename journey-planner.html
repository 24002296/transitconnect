<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Journey Planner | TransitConnect</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.navbar{
    background:#fff;
    border-bottom:1px solid #e5e9f2;
    padding:16px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:800;
}

.logo-icon{
    width:42px;
    height:42px;
    background:#2563eb;
    color:#fff;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back-link{
    color:#2563eb;
    font-weight:700;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.header{
    padding:35px 0 25px;
}

.header h1{
    font-size:32px;
    margin-bottom:6px;
}

.header p{
    color:#697386;
}

/* SEARCH */

.search-box{
    background:#fff;
    border:1px solid #e5e9f2;
    border-radius:16px;
    padding:22px;
    margin-bottom:25px;
    box-shadow:0 4px 15px rgba(15,23,42,.04);
}

.search-grid{
    display:grid;
    grid-template-columns:1fr 1fr 180px auto;
    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-size:12px;
    font-weight:700;
    margin-bottom:5px;
}

.field input{
    padding:12px;
    border:1px solid #dce2eb;
    border-radius:9px;
    outline:none;
}

.field input:focus{
    border-color:#2563eb;
}

.search-btn{
    align-self:end;
    border:none;
    background:#2563eb;
    color:white;
    padding:12px 20px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
}

.search-btn:hover{
    background:#1d4ed8;
}

/* FILTERS */

.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter{
    border:1px solid #dce2eb;
    background:#fff;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
}

.filter.active{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
}

.sort{
    padding:9px 12px;
    border:1px solid #dce2eb;
    border-radius:8px;
    background:#fff;
}

/* ROUTES */

.results-info{
    margin-bottom:15px;
    color:#697386;
    font-size:14px;
}

.route-card{
    background:#fff;
    border:1px solid #e5e9f2;
    border-radius:16px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(15,23,42,.04);
}

.route-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.transport{
    display:flex;
    gap:12px;
    align-items:center;
}

.transport-icon{
    width:48px;
    height:48px;
    background:#eef4ff;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.operator{
    font-weight:800;
}

.type{
    color:#7a8495;
    font-size:13px;
}

.badge{
    background:#dcfce7;
    color:#15803d;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.route-main{
    display:grid;
    grid-template-columns:1fr 130px 1fr;
    align-items:center;
    gap:15px;
    margin:20px 0;
}

.location strong{
    display:block;
    font-size:17px;
}

.location span{
    color:#697386;
    font-size:13px;
}

.time{
    text-align:center;
}

.time strong{
    font-size:19px;
}

.duration{
    color:#7a8495;
    font-size:12px;
}

.line{
    height:2px;
    background:#dbe3ef;
    position:relative;
    margin-top:5px;
}

.line:after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#2563eb;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.route-bottom{
    border-top:1px solid #edf0f5;
    padding-top:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.details{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    color:#697386;
    font-size:13px;
}

.price{
    font-size:22px;
    font-weight:800;
    color:#15803d;
}

.select-btn{
    border:none;
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
}

.select-btn:hover{
    background:#1d4ed8;
}

.legs{
    margin-top:12px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.leg{
    background:#f1f5f9;
    padding:5px 9px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
}

.empty{
    background:#fff;
    border:1px solid #e5e9f2;
    border-radius:16px;
    padding:45px 20px;
    text-align:center;
    color:#697386;
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

.notice{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    padding:14px 16px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:13px;
}

footer{
    text-align:center;
    padding:35px 20px;
    color:#7a8495;
    font-size:13px;
}

@media(max-width:900px){

    .search-grid{
        grid-template-columns:1fr 1fr;
    }

    .route-main{
        grid-template-columns:1fr;
        text-align:left;
    }

    .time{
        text-align:left;
    }

    .line{
        display:none;
    }

}

@media(max-width:600px){

    .search-grid{
        grid-template-columns:1fr;
    }

    .controls{
        flex-direction:column;
        align-items:flex-start;
    }

    .route-top{
        flex-direction:column;
    }

    .route-bottom{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <a href="dashboard.html" class="logo">

        <span class="logo-icon">
            🚆
        </span>

        <span>
            TransitConnect
        </span>

    </a>

    <a
        href="dashboard.html"
        class="back-link"
    >
        ← Dashboard
    </a>

</nav>


<main class="container">


<section class="header">

    <h1>
        Plan Your Journey
    </h1>

    <p>
        Compare available taxi, bus, train and integrated journeys.
    </p>

</section>


<div class="notice">

    💡 Journeys displayed here are created and managed
    by the TransitConnect administrator.

</div>


<!-- SEARCH -->

<section class="search-box">

    <div class="search-grid">

        <div class="field">

            <label>
                From
            </label>

            <input
                type="text"
                id="fromInput"
                placeholder="e.g. Johannesburg"
            >

        </div>


        <div class="field">

            <label>
                To
            </label>

            <input
                type="text"
                id="toInput"
                placeholder="e.g. Pretoria"
            >

        </div>


        <div class="field">

            <label>
                Travel Date
            </label>

            <input
                type="date"
                id="dateInput"
            >

        </div>


        <button
            class="search-btn"
            id="searchBtn"
        >
            🔎 Search
        </button>

    </div>

</section>


<!-- CONTROLS -->

<section class="controls">

    <div class="filters">

        <button
            class="filter active"
            data-type="All"
        >
            All
        </button>

        <button
            class="filter"
            data-type="Taxi"
        >
            🚕 Taxi
        </button>

        <button
            class="filter"
            data-type="Bus"
        >
            🚌 Bus
        </button>

        <button
            class="filter"
            data-type="Train"
        >
            🚆 Train
        </button>

        <button
            class="filter"
            data-type="Integrated"
        >
            🔗 Integrated
        </button>

    </div>


    <select
        class="sort"
        id="sortSelect"
    >

        <option value="recommended">
            Recommended
        </option>

        <option value="price">
            Lowest Price
        </option>

        <option value="duration">
            Shortest Time
        </option>

    </select>

</section>


<div
    class="results-info"
    id="resultsInfo"
>
    Showing available journeys
</div>


<!-- RESULTS -->

<section id="results">

</section>


</main>


<footer>

    © 2026 TransitConnect

    <br>

    Integrated Taxi, Bus & Train Journey Planning System

</footer>


<script>

/* =========================================================
   LOGIN
========================================================= */

const currentUser =
    JSON.parse(
        localStorage.getItem("currentUser")
    );


if(!currentUser){

    alert(
        "Please log in first."
    );

    window.location.href =
        "login.html";

}


/* =========================================================
   ELEMENTS
========================================================= */

const fromInput =
    document.getElementById("fromInput");

const toInput =
    document.getElementById("toInput");

const dateInput =
    document.getElementById("dateInput");

const searchBtn =
    document.getElementById("searchBtn");

const results =
    document.getElementById("results");

const resultsInfo =
    document.getElementById("resultsInfo");

const sortSelect =
    document.getElementById("sortSelect");


let activeType = "All";


/* =========================================================
   DATE
========================================================= */

const today =
    new Date().toISOString().split("T")[0];

dateInput.min = today;


/* =========================================================
   LOAD PREVIOUS SEARCH
========================================================= */

const previousSearch =
    JSON.parse(
        localStorage.getItem(
            "journeySearch"
        ) || "null"
    );


if(previousSearch){

    fromInput.value =
        previousSearch.from || "";

    toInput.value =
        previousSearch.to || "";

    dateInput.value =
        previousSearch.date || "";

}


/* =========================================================
   GET ROUTES
========================================================= */

function getRoutes(){

    return JSON.parse(
        localStorage.getItem(
            "transitconnect_routes"
        ) || "[]"
    );

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value || "")
        .toLowerCase()
        .replace(/station/g,"")
        .replace(/cbd/g,"")
        .trim();

}


/* =========================================================
   SEARCH
========================================================= */

function searchRoutes(){

    const from =
        normalize(fromInput.value);

    const to =
        normalize(toInput.value);


    localStorage.setItem(
        "journeySearch",
        JSON.stringify({

            from:
                fromInput.value.trim(),

            to:
                toInput.value.trim(),

            date:
                dateInput.value

        })
    );


    let routes =
        getRoutes();


    /* MATCH ORIGIN */

    if(from){

        routes =
            routes.filter(
                route =>
                    normalize(route.from)
                        .includes(from) ||
                    from.includes(
                        normalize(route.from)
                    )
            );

    }


    /* MATCH DESTINATION */

    if(to){

        routes =
            routes.filter(
                route =>
                    normalize(route.to)
                        .includes(to) ||
                    to.includes(
                        normalize(route.to)
                    )
            );

    }


    /* FILTER TYPE */

    if(activeType !== "All"){

        routes =
            routes.filter(
                route =>
                    route.type === activeType
            );

    }


    /* SORT */

    const sort =
        sortSelect.value;


    routes.sort(function(a,b){

        if(sort === "price"){

            return Number(a.price) -
                   Number(b.price);

        }


        if(sort === "duration"){

            return Number(a.duration) -
                   Number(b.duration);

        }


        return (
            Number(Boolean(b.recommended)) -
            Number(Boolean(a.recommended))
        );

    });


    renderRoutes(routes);

}


/* =========================================================
   RENDER ROUTES
========================================================= */

function renderRoutes(routes){

    if(routes.length === 0){

        resultsInfo.textContent =
            "No journeys found.";

        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <h2>
                    No journeys available
                </h2>

                <p>
                    Try another origin, destination
                    or transport type.
                </p>

            </div>

        `;

        return;

    }


    resultsInfo.textContent =
        routes.length +
        (
            routes.length === 1
            ? " journey found"
            : " journeys found"
        );


    results.innerHTML =
        routes.map(function(route){

            return `

                <article class="route-card">

                    <div class="route-top">

                        <div class="transport">

                            <div class="transport-icon">

                                ${route.icon || "🚆"}

                            </div>

                            <div>

                                <div class="operator">

                                    ${escapeHTML(
                                        route.operator
                                    )}

                                </div>

                                <div class="type">

                                    ${escapeHTML(
                                        route.type
                                    )}

                                </div>

                            </div>

                        </div>


                        ${
                            route.recommended
                            ? `
                                <span class="badge">
                                    ⭐ Recommended
                                </span>
                              `
                            : ""
                        }

                    </div>


                    <div class="route-main">

                        <div class="location">

                            <strong>

                                ${escapeHTML(
                                    route.from
                                )}

                            </strong>

                            <span>
                                Departure
                            </span>

                        </div>


                        <div class="time">

                            <strong>

                                ${escapeHTML(
                                    route.departure
                                )}

                            </strong>

                            <div class="line"></div>

                            <span class="duration">

                                ${formatDuration(
                                    route.duration
                                )}

                            </span>

                        </div>


                        <div class="location">

                            <strong>

                                ${escapeHTML(
                                    route.to
                                )}

                            </strong>

                            <span>
                                Arrival
                            </span>

                        </div>

                    </div>


                    ${
                        route.type === "Integrated" &&
                        Array.isArray(route.legs)

                        ? `

                            <div class="legs">

                                ${route.legs.map(
                                    leg => `
                                        <span class="leg">
                                            ${escapeHTML(leg)}
                                        </span>
                                    `
                                ).join("")}

                            </div>

                          `

                        : ""

                    }


                    <div class="route-bottom">

                        <div class="details">

                            <span>
                                🕐
                                ${formatDuration(
                                    route.duration
                                )}
                            </span>

                            <span>
                                🔄
                                ${route.transfers || 0}
                                transfers
                            </span>

                            <span>
                                📌
                                ${escapeHTML(
                                    route.status ||
                                    "Available"
                                )}
                            </span>

                        </div>


                        <div>

                            <div class="price">

                                ${formatCurrency(
                                    route.price
                                )}

                            </div>

                            <button
                                class="select-btn"
                                onclick="selectJourney('${route.id}')"
                            >
                                Select Journey →
                            </button>

                        </div>

                    </div>

                </article>

            `;

        }).join("");

}


/* =========================================================
   SELECT JOURNEY
========================================================= */

function selectJourney(id){

    const routes =
        getRoutes();


    const route =
        routes.find(
            item => item.id === id
        );


    if(!route){

        alert(
            "Journey could not be found."
        );

        return;

    }


    localStorage.setItem(
        "selectedRoute",
        JSON.stringify(route)
    );


    localStorage.setItem(
        "selectedTravelDate",
        dateInput.value
    );


    window.location.href =
        "journey-details.html";

}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(minutes){

    minutes =
        Number(minutes) || 0;


    const hours =
        Math.floor(minutes / 60);


    const mins =
        minutes % 60;


    if(hours === 0){

        return mins + " min";

    }


    if(mins === 0){

        return hours + " hr";

    }


    return (
        hours +
        " hr " +
        mins +
        " min"
    );

}


/* =========================================================
   FORMAT CURRENCY
========================================================= */

function formatCurrency(amount){

    return "R" +
        (Number(amount) || 0).toFixed(2);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
    .querySelectorAll(".filter")
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(".filter")
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                activeType =
                    button.dataset.type;


                searchRoutes();

            }
        );

    });


/* =========================================================
   EVENTS
========================================================= */

searchBtn.addEventListener(
    "click",
    searchRoutes
);


sortSelect.addEventListener(
    "change",
    searchRoutes
);


/* =========================================================
   ENTER KEY
========================================================= */

[fromInput,toInput,dateInput]
    .forEach(function(input){

        input.addEventListener(
            "keydown",
            function(event){

                if(event.key === "Enter"){

                    searchRoutes();

                }

            }
        );

    });


/* =========================================================
   INITIAL DISPLAY
========================================================= */

searchRoutes();

</script>

</body>
</html>
